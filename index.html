<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kore Tally</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1a1a1a;
    --accent: #2563eb;
    --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #f0f0f0;
    }
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 2rem 3rem;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    min-width: 280px;
  }
  h1 {
    margin: 0 0 1rem;
    font-size: 1.25rem;
    font-weight: 600;
  }
  #count {
    font-size: 4rem;
    font-weight: 700;
    margin: 0.5rem 0 1.5rem;
  }
  .buttons {
    display: flex;
    gap: 0.75rem;
    justify-content: center;
  }
  button {
    border: none;
    border-radius: 10px;
    padding: 0.75rem 1.25rem;
    font-size: 1rem;
    cursor: pointer;
    color: white;
  }
  #decrement { background: var(--danger); }
  #increment { background: var(--accent); }
  #reset { background: #6b7280; }
</style>
</head>
<body>
  <div class="card">
    <h1>Kore Tally</h1>
    <div id="count">0</div>
    <div class="buttons">
      <button id="decrement">-1</button>
      <button id="reset">Reset</button>
      <button id="increment">+1</button>
    </div>
  </div>
  <script>
    const countEl = document.getElementById('count');
    const STORAGE_KEY = 'kore-tally-count';

    let count = Number(localStorage.getItem(STORAGE_KEY)) || 0;
    countEl.textContent = count;

    function updateCount(newCount) {
      count = newCount;
      countEl.textContent = count;
      localStorage.setItem(STORAGE_KEY, count);
    }

    document.getElementById('increment').addEventListener('click', () => updateCount(count + 1));
    document.getElementById('decrement').addEventListener('click', () => updateCount(count - 1));
    document.getElementById('reset').addEventListener('click', () => updateCount(0));
  </script>
</body>
</html>
